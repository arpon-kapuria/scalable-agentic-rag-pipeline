
# This is the spec sent to the Ray Job Submission API
entrypoint: "python3 pipelines/ingestion/main.py"

# Runtime Environment: Dependencies required on the workers
runtime_env:
  working_dir: "."

  pip: 
    - boto3>=1.42.63
    - langchain>=1.2.10
    - langchain-text-splitters>=1.1.1
    - neo4j>=6.1.0
    - qdrant-client>=1.17.0
    - sentence-transformers>=5.2.3
    - unstructured[docx,pdf]>=0.21.5
    - httpx>=0.28.1
    - ray[default]>=2.54.0

  env_vars:
    # Environment variables injected into workers
    LOG_LEVEL: "INFO"
    # Secrets are injected via K8s Secrets, not here for security

# Resource Request for the Driver (The orchestrator script)
num_cpus: 1
num_gpus: 0