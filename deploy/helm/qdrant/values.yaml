# CHANGED: 3 replicas → 1 replica
# 3 replicas × 2 CPU + 4Gi RAM each = 6 CPU + 12Gi total
# Single replica = 1 CPU + 2Gi RAM — fits on t3.medium

replicaCount: 1   # ← no HA, single node for dev

config:
  storage:
    on_disk_payload: true   # ← keep — prevents OOM on large datasets
  service:
    enable_tls: false

resources:
  requests:
    cpu: "0.5"      # ← reduced from 2
    memory: "1Gi"   # ← reduced from 4Gi
  limits:
    cpu: "1"        # ← reduced from 4
    memory: "2Gi"   # ← reduced from 8Gi

persistence:
  size: 10Gi              # ← reduced from 50Gi
  storageClassName: gp2   # ← gp2 instead of gp3, available by default on EKS