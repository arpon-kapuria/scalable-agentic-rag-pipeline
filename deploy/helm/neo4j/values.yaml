neo4j:
  name: "neo4j-dev"
  edition: "community"

  core:
    numberOfServers: 1

    resources:
      requests:
        cpu: "0.5"      # ← reduced from 2
        memory: "2Gi"   # ← reduced from 8Gi

  volumes:
    data:
      mode: "default"
      storageClassName: "gp2"   # ← gp2 instead of gp3
      size: "10Gi"              # ← reduced from 100Gi