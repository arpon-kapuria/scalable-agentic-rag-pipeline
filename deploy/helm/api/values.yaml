replicaCount: 1

image:
  repository: 371637912340.dkr.ecr.us-east-1.amazonaws.com/rag-api
  tag: latest
  pullPolicy: Always

service:
  type: ClusterIP
  port: 80
  targetPort: 8000

resources:
  requests:
    cpu: "500m"
    memory: "512Mi"
  limits:
    cpu: "1"
    memory: "1Gi"

# Non-sensitive environment variables
env:
  ENV: "prod"
  LOG_LEVEL: "INFO"
  AWS_REGION: "us-east-1"
  S3_BUCKET_NAME: "rag-platform-documents-dev-001"
  QDRANT_HOST: "qdrant-service"
  QDRANT_PORT: "6333"
  QDRANT_COLLECTION: "scalable_rag_collection"
  NEO4J_URI: "bolt://neo4j-cluster:7687"
  NEO4J_USER: "neo4j"
  RAY_LLM_ENDPOINT: "http://llm-service:8000/llm"
  RAY_EMBEDDING_ENDPOINT: "http://embed-service:8000/embed"
  OTEL_EXPORTER_OTLP_ENDPOINT: "http://jaeger-allInOne.monitoring:4317"

# Sensitive vars injected from Kubernetes secret
# Created automatically by External Secrets Operator from AWS Secrets Manager
envFromSecret: app-env-secret

# Liveness and readiness probes
livenessProbe:
  httpGet:
    path: /health/liveness
    port: 8000
  initialDelaySeconds: 30
  periodSeconds: 10

readinessProbe:
  httpGet:
    path: /health/readiness
    port: 8000
  initialDelaySeconds: 30
  periodSeconds: 10