apiVersion: ray.io/v1
kind: RayService
metadata:
  name: embed-service
spec:
  serveConfigV2: |
    applications:
      - name: embeddings
        import_path: services.api.app.models.embedding_engine:app
        route_prefix: /embed
        deployments:
          - name: EmbedDeployment
            autoscaling_config:
              min_replicas: 1
              max_replicas: 2    # ← reduced from 5
              target_num_ongoing_requests_per_replica: 10
            ray_actor_options:
              num_cpus: 1
              num_gpus: 0        # ← no GPU, CPU inference only