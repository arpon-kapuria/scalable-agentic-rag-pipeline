# Config map merged into RayCluster definition via KubeRay

autoscaling:
  enabled: true
  upscaling_speed: 1.0
  idle_timeout_minutes: 5

  worker_nodes:
    cpu_worker_group:
      min_workers: 1
      max_workers: 3          # ← reduced from 50
      resources: {"CPU": 1, "memory": "2Gi"}   # ← reduced from 8 CPU / 32Gi

