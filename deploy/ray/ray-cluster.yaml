apiVersion: ray.io/v1
kind: RayCluster
metadata:
  name: rag-ray-cluster
  namespace: default
spec:
  rayVersion: '2.9.0'

  headGroupSpec:
    serviceType: ClusterIP
    rayStartParams:
      dashboard-host: '0.0.0.0'
      num-cpus: '0'
    template:
      spec:
        containers:
        - name: ray-head
          image: rayproject/ray:2.9.0-py310   # ← CPU image, not GPU
          resources:
            limits:
              cpu: "1"        # ← reduced from 2
              memory: "2Gi"   # ← reduced from 8Gi
            requests:
              cpu: "1"
              memory: "2Gi"

  workerGroupSpecs:
  - groupName: cpu-workers
    replicas: 1
    minReplicas: 1
    maxReplicas: 3        # ← reduced from 50
    rayStartParams: {}
    template:
      spec:
        containers:
        - name: ray-worker
          image: rayproject/ray:2.9.0-py310   # ← CPU image
          resources:
            limits:
              cpu: "1"        # ← reduced from 8
              memory: "2Gi"   # ← reduced from 32Gi
            requests:
              cpu: "1"
              memory: "2Gi"

  # GPU WORKER GROUP REMOVED ENTIRELY
  # Not feasible on $180 credits alongside other infrastructure
  # Add back when upgrading to paid account