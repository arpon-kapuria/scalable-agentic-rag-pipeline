apiVersion: ray.io/v1
kind: RayService
metadata:
  name: llm-service
spec:
  serviceUnhealthySecondThreshold: 300
  deploymentUnhealthySecondThreshold: 300

  serveConfigV2: |
    applications:
      - name: tinyllama
        import_path: services.api.app.models.vllm_engine:app
        route_prefix: /llm
        runtime_env:
          pip: ["torch==2.1.2", "transformers==4.37.0"]
          env_vars:
            # CHANGED: 70B → TinyLlama 1.1B
            # Llama 3 70B needs 140GB GPU RAM — impossible without GPU nodes
            # TinyLlama runs on CPU with ~4GB RAM — works on t3.medium
            # Quality is lower but functional for dev/testing
            MODEL_ID: "TinyLlama/TinyLlama-1.1B-Chat-v1.0"

        deployments:
          - name: VLLMDeployment
            autoscaling_config:
              min_replicas: 1
              max_replicas: 2    # ← reduced from 10
              target_num_ongoing_requests_per_replica: 5  # ← reduced
            ray_actor_options:
              num_cpus: 2
              num_gpus: 0        # ← no GPU
            user_config:
              max_model_len: 2048    # ← reduced from 8192
              max_num_seqs: 4        # ← reduced from 128