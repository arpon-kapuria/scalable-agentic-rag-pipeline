apiVersion: karpenter.sh/v1beta1
kind: Provisioner
metadata:
  name: cpu-provisioner
spec:
  limits:
    resources:
      cpu: 8        # ← reduced from 1000 — hard cap for cost control

  providerRef:
    name: default

  requirements:
    - key: "karpenter.k8s.aws/instance-family"
      operator: In
      values: ["t3"]   # ← cheapest instance family only

    - key: "karpenter.sh/capacity-type"
      operator: In
      values: ["spot"]  # ← spot only for maximum savings

  consolidation:
    enabled: true