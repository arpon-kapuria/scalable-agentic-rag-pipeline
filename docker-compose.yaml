name: omnirag

services:
  # 1. Postgres (Chat History) — profile: core
  postgres:
    image: postgres:15-alpine
    container_name: omnirag-postgres
    profiles: ["core"]
    environment:
      POSTGRES_USER: omnirag
      POSTGRES_PASSWORD: omnirag_dev_password
      POSTGRES_DB: omnirag_db
    ports:
      - "5432:5432"
    volumes:
      - omnirag_pg_data:/var/lib/postgresql/data

  # 2. Redis (Session storage + cache) — profile: cache
  # Needed as early as Phase 2 (session storage), not just Phase 5 (caching) — same
  # container, two uses, brought up once under one profile.
  redis:
    image: redis:7-alpine
    container_name: omnirag-redis
    profiles: ["cache"]
    ports:
      - "6379:6379"

  # 3. Qdrant (Vector DB) — profile: vector
  qdrant:
    image: qdrant/qdrant:v1.17.0
    container_name: omnirag-qdrant
    profiles: ["vector"]
    ports:
      - "6333:6333"
    volumes:
      - omnirag_qdrant_data:/qdrant/storage

  # 4. Neo4j (Graph DB) — profile: graph
  neo4j:
    image: neo4j:6.1.0
    container_name: omnirag-neo4j
    profiles: ["graph"]
    environment:
      # Username stays "neo4j" (built-in initial-admin convention); password is ours.
      NEO4J_AUTH: neo4j/omnirag_dev_password
      NEO4J_dbms_memory_pagecache_size: 1G
    ports:
      - "7474:7474" # HTTP
      - "7687:7687" # Bolt
    volumes:
      - omnirag_neo4j_data:/data

  # 5. MinIO (S3-compatible object storage) — profile: storage
  minio:
    image: minio/minio
    container_name: omnirag-minio
    profiles: ["storage"]
    command: server /data
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: omnirag_admin
      MINIO_ROOT_PASSWORD: omnirag_dev_password
    volumes:
      - omnirag_minio_data:/data

volumes:
  omnirag_pg_data:
  omnirag_qdrant_data:
  omnirag_neo4j_data:
  omnirag_minio_data: