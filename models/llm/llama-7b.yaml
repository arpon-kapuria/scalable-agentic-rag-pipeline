# MINIMAL SETUP — replaces llama-7b with TinyLlama for CPU inference
model_config:
  model_id: "TinyLlama/TinyLlama-1.1B-Chat-v1.0"
quantization: null         # ← removed, AWQ requires GPU
max_model_len: 2048        # ← reduced from 8192
max_num_seqs: 4            # ← reduced from 256
dtype: "float32"           # ← CPU compatible
# gpu_memory_utilization removed — no GPU
# tensor_parallel_size removed — no GPU