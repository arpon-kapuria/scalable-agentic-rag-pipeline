[project]
name = "omnirag"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "boto3>=1.42.63",
    "tqdm>=4.67.3",
    "httpx>=0.28.1",
]

[dependency-groups]
api = [
    "fastapi>=0.135.1",
    "pydantic>=2.12.5",
    "pydantic-settings>=2.13.1",
    "pyjwt>=2.12.1",
    "uvicorn[standard]>=0.41.0",
    "redis>=5.2.1",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30.0",
    "neo4j>=6.1.0",
    "qdrant-client>=1.17.0",
    "langgraph>=1.1.4",
]
dev = [
    "pytest>=9.0.2",
    "ruff>=0.15.5",
]
ingestion = [
    "beautifulsoup4>=4.14.3",
    "langchain>=1.2.10",
    "langchain-text-splitters>=1.1.1",
    "neo4j>=6.1.0",
    "qdrant-client>=1.17.0",
    "python-docx>=1.1.2",
    "opendataloader-pdf>=2.5.5",
    "PyMuPDF>=1.24.0",
    "fastembed>=0.8.0",
    "pyarrow>=18.0.0",
    # Not used by the trimmed ingestion pipeline directly — kept for
    # models/embedding_engine.py (frozen Ray Serve code, Phase 11).
    "sentence-transformers>=5.2.3",
]
observability = [
    "opentelemetry-api>=1.40.0",
    "opentelemetry-exporter-otlp>=1.40.0",
    "opentelemetry-instrumentation-fastapi>=0.61b0",
    "opentelemetry-sdk>=1.40.0",
]
ray = [
    "ray[default]>=2.54.0",
]