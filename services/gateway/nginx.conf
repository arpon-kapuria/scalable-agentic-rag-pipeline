# services/gateway/nginx.conf

worker_processes auto;

events {
    worker_connections 1024;
}

http {
    # Load Lua package path
    lua_package_path "/etc/nginx/lua/?.lua;;";

    # Shared memory for rate limiting state
    lua_shared_dict rate_limit_store 10m;

    upstream fastapi {
        server api-service:8000;
        keepalive 32;
    }

    server {
        listen 80;
        server_name _;

        # Apply rate limiting on every request
        access_by_lua_file /etc/nginx/lua/rate_limit.lua;

        # Route all traffic to FastAPI
        location / {
            proxy_pass http://fastapi;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            # Critical for streaming responses
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
            proxy_buffering off;         # ← disable buffering for NDJSON streaming
        }

        # Health check endpoint — bypass rate limiting
        location /health {
            access_by_lua_block { }     # ← empty block skips rate_limit.lua
            proxy_pass http://fastapi;
        }
    }
}